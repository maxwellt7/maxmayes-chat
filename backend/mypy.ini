; Typechecking policy: a ratchet, not a cleanup.
;
; The goal is that new code cannot introduce type errors, and that the modules
; carrying the security and persistence invariants are held to a higher standard
; than the rest of the tree has earned. Turning strict mode on everywhere would
; mean annotating a few thousand lines of pre-existing service code in the same
; change that adds the CI enforcing it — which is how ratchets get switched off
; a week later.
;
; Three tiers:
;   1. default — light checks, applies to every module not named below.
;   2. strict  — modules at zero errors under the full strict flag set. A new
;                untyped function or unparameterised generic in any of them
;                fails CI.
;   3. legacy  — a closed list of modules with known pre-existing errors, with a
;                reason recorded for each. Errors are ignored there, but the
;                modules are still parsed, so a syntax or name error still
;                fails. Nothing may be added to this list without a reason, and
;                the list is meant to shrink.
;
; Note on `strict = True`: mypy accepts it inside a per-module section but
; applies it to the whole run, silently, which is why the strict tier below
; enumerates the individual flags instead. Verified against mypy 2.3.0.
;
; Run: mypy --config-file mypy.ini

[mypy]
; Matches the deployed runtime (`Dockerfile` is python:3.12-slim), not whatever
; the local venv happens to be, so CI checks what production will actually run.
python_version = 3.12
files = app
namespace_packages = True
explicit_package_bases = True
mypy_path = .

; Global-only flags.
warn_unused_configs = True
warn_redundant_casts = True

; Tier 1 defaults. Enough to catch a real mistake in a module nobody has
; annotated yet, without demanding annotations as the price of admission.
check_untyped_defs = True
warn_no_return = True
no_implicit_optional = True
show_error_codes = True
pretty = True

; -----------------------------------------------------------------------------
; Tier 2 — strict.
;
; `app.security` is the authorization boundary. `app.core` is the closed error
; taxonomy that keeps provider internals out of client responses. `app.db` and
; `app.models` define the schema and the session lifecycle. `app.routers` is
; where the authorization checks are actually applied, and where the SSE stream
; lives. These are the files where a silent `Any` costs the most.
;
; This is the flag set `--strict` expands to, minus the two global-only flags
; already set above.
; -----------------------------------------------------------------------------

[mypy-app.security.*,app.core.*,app.db.*,app.models.*,app.routers.*,app.config,app.main]
disallow_any_generics = True
disallow_subclassing_any = True
disallow_untyped_calls = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
check_untyped_defs = True
warn_unused_ignores = True
warn_return_any = True
no_implicit_reexport = True
strict_equality = True
extra_checks = True

; -----------------------------------------------------------------------------
; Tier 3 — legacy. Named modules only: a *new* module under app/services/ gets
; tier 1, not an exemption.
; -----------------------------------------------------------------------------

; The OpenAI client types `choices[0].message.content` as `str | None`, and all
; four of these modules call `.strip()` or `json.loads()` on it directly. That
; is a genuine latent bug — a refusal or a length-capped completion returns
; None and raises AttributeError at runtime — but fixing it means deciding what
; the pipeline should *do* with an empty completion, which is a behaviour change
; and does not belong in the commit that turns on the typechecker.
[mypy-app.services.orchestrator]
ignore_errors = True

[mypy-app.services.llm_service]
ignore_errors = True

[mypy-app.services.auto_describe]
ignore_errors = True

; Additionally indexes into a Cohere response union without narrowing:
; `EmbedByTypeResponseEmbeddings.float` does not exist (it is `float_`), and the
; OpenAI and Cohere response objects are assigned to the same variable. Reaching
; that branch would raise. Same reasoning as above — a real bug, not a typing
; one.
[mypy-app.services.embedding_service]
ignore_errors = True

; `CohereEmbeddings` and `SemanticChunker` are constructed with kwargs langchain's
; own annotations reject (`cohere_api_key` wants `SecretStr`, `client` and
; `async_client` are marked required). The code works; the upstream annotations
; are wrong for the documented usage.
[mypy-app.services.chunking_service]
ignore_errors = True

; -----------------------------------------------------------------------------
; Third-party packages that ship no type information.
; -----------------------------------------------------------------------------

[mypy-pinecone.*]
ignore_missing_imports = True

[mypy-cohere.*]
ignore_missing_imports = True

[mypy-langchain_cohere.*]
ignore_missing_imports = True

[mypy-langchain_experimental.*]
ignore_missing_imports = True
